<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header style="background-image: url('HabsTracker1909Logo.png'); background-size: cover; background-position: center;">
        <div class="header-overlay">
            <h1>Standings</h1>
            <p class="tagline">Latest Teams Standings</p>
        </div>
    </header>

    <Nav>
        <a href="index.html">Home</a>
        <a href="scores.html">Scores</a>
        <a href="standings.html" class="active">Standings</a>
        <a href="team.html">Team</a>
        <a href="history.html">History</a>

    </Nav>

    <section class="Standings">
            <h2>Latest Standings</h2>
            <p>Stay updated with the latest standings and updates from the world of sports.</p>
            <div id="standings-container">Loading standings...</div>
        </section>
    <script>
    /*Fetch standings when page loads and refresh every 10 minutes*/
       async function fetchNHLStandings() {
    try {
        const response = await fetch('https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/standings');
        const data = await response.json();

        console.log(data); // 👈 keep this for debugging

        const standingsContainer = document.getElementById('standings-container');

        const standings = data?.children?.[0]?.standings?.entries || [];

        if (!standings.length) {
            standingsContainer.innerHTML = "<p>No standings data available</p>";
            return;
        }

        let html = `
            <table style="width:100%; border-collapse:collapse;">
                <tr>
                    <th>Team</th>
                    <th>W</th>
                    <th>L</th>
                    <th>OT</th>
                    <th>PTS</th>
                </tr>
        `;

        standings.forEach(team => {
            const stats = team.stats || [];

            const wins = stats.find(s => s.name === 'wins')?.value || 0;
            const losses = stats.find(s => s.name === 'losses')?.value || 0;
            const ot = stats.find(s => s.name === 'overtimeLosses')?.value || 0;
            const pts = stats.find(s => s.name === 'points')?.value || 0;

            html += `
                <tr>
                    <td>${team.team.displayName}</td>
                    <td>${wins}</td>
                    <td>${losses}</td>
                    <td>${ot}</td>
                    <td><strong>${pts}</strong></td>
                </tr>
            `;
        });

        html += `</table>`;

        standingsContainer.innerHTML = html;

    } catch (error) {
        console.error('Error fetching standings:', error);
        document.getElementById('standings-container').innerHTML =
            '<p>Unable to load standings.</p>';
    }
}

    fetchNHLStandings();
    setInterval(fetchNHLStandings, 600000); // Refresh every 10 minutes
    </script>

    <footer>
        <p>&copy; 2026 HabsTracker1909. All rights reserved.</p>
        <p>Follow us on : <a href="#">Instagram</a></p>
    </footer>

</body>
</html>
