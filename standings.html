<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header
        style="background-image: url('HabsTracker1909Logo.png'); background-size: cover; background-position: center;">
        <div class="header-overlay">
            <h1>Standings</h1>
            <p class="tagline">Latest Teams Standings</p>
        </div>
    </header>

    <Nav>
        <a href="index.html">Home</a>
        <a href="scores.html">Scores</a>
        <a href="standings.html" class="active">Standings</a>
        <a href="team.html">Team</a>
        <a href="history.html">History</a>

    </Nav>

    <section class="Standings">
        <h2>Latest Standings</h2>
        <p>Stay updated with the latest standings and updates from the world of sports.</p>
        <div style="text-align:center; margin-bottom:20px;">
            <button onclick="setView('league', event)" class="view-btn active">League</button>
            <button onclick="setView('conferences', event)" class="view-btn">Conferences</button>
        </div>
        <div id="standings-container">Loading standings...</div>
    </section>
    <script>
        let standingsData = null;
        let currentView = 'league';
        async function fetchNHLStandings() {
            try {
                const response = await fetch(
                    'https://site.web.api.espn.com/apis/v2/sports/hockey/nhl/standings'
                );
                const data = await response.json();

                standingsData = data;

                renderStandings();

            } catch (error) {
                console.error(error);
            }
        }
        function renderStandings() {
            const container = document.getElementById('standings-container');

            if (!standingsData) return;

            let html = '';

            if (currentView === 'league') {

                // 🔥 LEAGUE VIEW (ALL TEAMS SORTED)
                let allTeams = [];

                standingsData.children.forEach(conf => {
                    conf.standings.entries.forEach(team => {
                        allTeams.push(team);
                    });
                });

                // Sort by points
                allTeams.sort((a, b) => {
                    const aPts = a.stats.find(s => s.name === 'points')?.value || 0;
                    const bPts = b.stats.find(s => s.name === 'points')?.value || 0;
                    return bPts - aPts;
                });

                html += buildTable(allTeams, "NHL League Standings");

            } else if (currentView === 'conferences') { 
                // 🔥 CONFERENCES VIEW 
                standingsData.children.forEach(conf => { 
                    const conference = conf.standings?.entries || [];
                     // Group teams by conference name const 
                     conferenceMap = {}; 
                     conference.forEach(team => { 
                     const conferenceName = team.team?.conference?.name || "Unknown Conference"; 
                     if (!conferenceMap[conferenceName]) { 
                        conferenceMap[conferenceName] = []; 
                    } 
                    conferenceMap[conferenceName].push(team); 
                }); 
                // Build tables per conference 
                Object.keys(conferenceMap).forEach(confName => { 
                    let teams = conferenceMap[confName]; 
                    teams.sort((a, b) => { 
                        const aPts = a.stats.find(s => s.name === 'points')?.value || 0; 
                        const bPts = b.stats.find(s => s.name === 'points')?.value || 0; 
                        return bPts - aPts; 
                    }); 
                        
                    html += buildTable(teams, confName); 
                }); 
            });
            }

            container.innerHTML = html;
        }
        function buildTable(teams, title) {
            let html = `
        <h3 style="margin-top:20px;">${title}</h3>
        <table>
            <tr>
                <th>#</th>
                <th>Team</th>
                <th>W</th>
                <th>L</th>
                <th>OT</th>
                <th>PTS</th>
                <th>DIFF</th>
            </tr>
    `;

            teams.forEach((team, index) => {
                const stats = team.stats;

                const wins = stats.find(s => s.name === 'wins')?.value || 0;
                const losses = stats.find(s => s.name === 'losses')?.value || 0;
                const ot = stats.find(s => s.name === 'overtimeLosses')?.value || 0;
                const pts = stats.find(s => s.name === 'points')?.value || 0;
                //I DID IT!!!
                const diff = stats.find(s => s.name === 'pointsDiff')?.value || 0;
                const clincher = stats.find(s => s.type === 'clincher');
                const clinchMark = clincher ? clincher.displayValue : '';




                html += `
            <tr ${team.team.displayName === 'Montreal Canadiens' ? 'style="background:rgba(189,48,57,0.2); font-weight:bold;"' : ''}>
                <td>${index + 1}</td>
                <td style="display:flex; align-items:center; gap:8px;">
                    ${clinchMark ? `<span style="color:#000000; font-weight:bold;">${clinchMark}</span>` : ''}
                    <img src="${team.team.logos?.[0]?.href}" width="25">
                    ${team.team.displayName}
                </td>
                
                <td>${wins}</td>
                <td>${losses}</td>
                <td>${ot}</td>
                <td><strong>${pts}</strong></td>
                <td>${diff}</td>
            </tr>
        `;
            });

            html += `</table>`;
            return html;
        }
        function setView(view, event) {
            currentView = view;

            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            event.target.classList.add('active');

            renderStandings();
        }

        fetchNHLStandings();
        setInterval(fetchNHLStandings, 600000);
    </script>

    <footer>
        <p>&copy; 2026 HabsTracker1909. All rights reserved.</p>
        <p>Follow us on : <a href="#">Instagram</a></p>
    </footer>

</body>

</html>
