<body>

                Toggle Dark Mode

<main>
    <section class="Team">
        <h2>Players</h2>
        <p>Montreal Canadiens roster and stats</p>

        <div id="filters" style="margin-bottom:20px;">
            <button onclick="filterPlayers('ALL')" class="filter-btn active">All</button>
            <button onclick="filterPlayers('F')" class="filter-btn">Forwards</button>
            <button onclick="filterPlayers('D')" class="filter-btn">Defense</button>
            <button onclick="filterPlayers('G')" class="filter-btn">Goalies</button>
        </div>
        <div id="sort-buttons" style="margin-bottom: 15px;">
            <button onclick="setSort('points', event)" class="sort-btn active">Points</button>
            <button onclick="setSort('goals', event)" class="sort-btn">Goals</button>
            <button onClick="setSort('assists', event)" class="sort-btn">Assists</button>
        </div>
        <!-- ✅ THIS WAS MISSING BEFORE -->
        <div id="players-container">Loading players...</div>
    </section>
</main>

<script>
let allPlayers = [];
let currentSort = "points";
//test api url
//https://sports.core.api.espn.com/v2/sports/hockey/leagues/nhl/seasons/2026/athletes/5344178

// ✅ Get stats for ONE player
async function getPlayerStats(playerId) {
    try {
        const playerRes = await fetch(
            `https://sports.core.api.espn.com/v2/sports/hockey/leagues/nhl/seasons/2026/athletes/${playerId}`
        );

        const playerData = await playerRes.json();

        // ✅ SAFELY check if statistics exists
        const statsRef = playerData?.statistics?.$ref;

        if (!statsRef) {
            return { goals: "0", assists: "0", points: "0" };
        }

        const statsUrl = statsRef.replace("http://", "https://");

        const statsRes = await fetch(statsUrl);
        const statsData = await statsRes.json();

        const categories = statsData.splits?.categories || [];

        const wantedStats = ["Goals", "Assists", "Points"];
        const statsResult = {};

        categories.forEach(category => {
            category.stats?.forEach(stat => {
                if (wantedStats.includes(stat.displayName) && !statsResult[stat.displayName]) {
                    statsResult[stat.displayName] = stat.displayValue;
                }
            });
        });

        return {
            goals: statsResult["Goals"] || "0",
            assists: statsResult["Assists"] || "0",
            points: statsResult["Points"] || "0"
        };

    } catch (err) {
        console.error("Stats error:", err);
        return { goals: "-", assists: "-", points: "-" };
    }
}
async function getGoalieStats(playerId) {
    try {
        const playerRes = await fetch(`https://sports.core.api.espn.com/v2/sports/hockey/leagues/nhl/seasons/2026/athletes/${playerId}`);
        const playerData = await playerRes.json();

        if (!playerData.statistics || !playerData.statistics.$ref) {
            return { gaa: "-", savePct: "-", saves: "-", wins: "-" };
        }

        const statsUrl = playerData.statistics.$ref.replace("http://", "https://");
        const statsRes = await fetch(statsUrl);
        const statsData = await statsRes.json();

        const categories = statsData.splits?.categories;

        const goalieStats = {};

        categories?.forEach(category => {
            category.stats?.forEach(stat => {
                if (!goalieStats[stat.displayName]) {
                    goalieStats[stat.displayName] = stat.displayValue;
                }
            });
        });

        return {
            gaa: goalieStats["Goals Against Average"] || "0",
            savePct: goalieStats["Save Percentage"] || "0",
            saves: goalieStats["Saves"] || "0",
            wins: goalieStats["Wins"] || "0"
        };

    } catch (err) {
        console.error("Goalie stats error:", err);
        return { gaa: "0", savePct: "0", saves: "0", wins: "0" };
    }
}
// ✅ Fetch roster
async function fetchPlayers() {
    try {
        const response = await fetch('https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/teams/10/roster');
        const data = await response.json();

        const athletes = data?.athletes || [];
        allPlayers = [];

        athletes.forEach(group => {
            group.items.forEach(player => {
                allPlayers.push(player);
            });
        });

        displayPlayers(allPlayers);

    } catch (error) {
        console.error(error);
        document.getElementById('players-container').innerHTML =
            "<p>Error loading players</p>";
    }
}

// ✅ Display players WITH stats
async function displayPlayers(players) {
    const container = document.getElementById('players-container');

    if (!players.length) {
        container.innerHTML = "<p>No players found</p>";
        return;
    }

    let playersWithStats = [];

    // 🔥 STEP 1: Fetch + store stats
    for (const player of players) {

        const isGoalie = player.position?.abbreviation === "G";

        let statsData;

        if (isGoalie) {
            const goalieStats = await getGoalieStats(player.id);

            statsData = {
                type: "G",
                gaa: parseFloat(goalieStats.gaa) || 0,
                savePct: parseFloat(goalieStats.savePct) || 0,
                saves: parseInt(goalieStats.saves) || 0,
                wins: parseInt(goalieStats.wins) || 0
            };

        } else {
            const stats = await getPlayerStats(player.id);

            statsData = {
                type: "S",
                goals: parseInt(stats.goals) || 0,
                assists: parseInt(stats.assists) || 0,
                points: parseInt(stats.points) || 0
            };
        }

        playersWithStats.push({
            player,
            stats: statsData
        });
    }

    // 🔥 STEP 2: SORT (default = points)
    playersWithStats.sort((a, b) => {
    // goalies always last
    if (a.stats.type === "G") return 1;
    if (b.stats.type === "G") return -1;

    if (currentSort === "goals") {
        return b.stats.goals - a.stats.goals;
    } else if (currentSort === "assists") {
        return b.stats.assists - a.stats.assists;
    } else {
        return b.stats.points - a.stats.points; // default
    }
});

    // 🔥 STEP 3: Build HTML AFTER sorting
    let html = '';

    playersWithStats.forEach(({ player, stats }) => {

        const height = player.displayHeight || "-";
        const weight = player.displayWeight || "-";
        const headshot = player.headshot?.href || "";

        let statsHtml = "";

        if (stats.type === "G") {
            statsHtml = `
                GAA: ${stats.gaa} | SV%: ${stats.savePct}<br>
                Saves: ${stats.saves} | Wins: ${stats.wins}
            `;
        } else {
            statsHtml = `
                G: ${stats.goals} | A: ${stats.assists} | PTS: ${stats.points}
            `;
        }

        html += `
            <div class="player-card" data-pos="${player.position?.abbreviation}">
                <img src="${headshot}">
                <div class="player-name">${player.fullName}</div>
                <div>#${player.jersey || ''} • ${player.position?.abbreviation || ''}</div>

                <div class="player-stats">
                    ${height} | ${weight}<br>
                    ${statsHtml}
                </div>
            </div>
        `;
    });

    container.innerHTML = html;
}

// ✅ Filter buttons
function filterPlayers(position) {
    const buttons = document.querySelectorAll('.filter-btn');
    buttons.forEach(btn => btn.classList.remove('active'));

    event.target.classList.add('active');

    if (position === 'ALL') {
        displayPlayers(allPlayers);
        return;
    }

    const filtered = allPlayers.filter(p => {
        if (!p.position) return false;

        if (position === 'F') {
            return ['C', 'LW', 'RW'].includes(p.position.abbreviation);
        }

        return p.position.abbreviation === position;
    });

    displayPlayers(filtered);
}

function setSort(type, event) {
    currentSort = type;

    const buttons = document.querySelectorAll('.sort-btn');
    buttons.forEach(btn => btn.classList.remove('active'));

    event.currentTarget.classList.add('active');

    displayPlayers(allPlayers);
}

// 🚀 Start
fetchPlayers();


</script>
