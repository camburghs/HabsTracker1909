<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header style="background-image: url('HabsTracker1909Logo.png'); background-size: cover; background-position: center;">
        <div class="header-overlay">
            <h1>Habs Scores</h1>
            <p class="tagline">Out Of Town Games</p>
        </div>
    </header>

    <Nav>
        <a href="index.html">Home</a>
        <a href="scores.html" class="active">Scores</a>
        <a href="standings.html">Standings</a>
        <a href="team.html">Team</a>
        <a href="history.html">History</a>

    </Nav>

    <main>
        <section class="hero">
            <h2>Scores, and Out of Town Games</h2>
            <p>Live and Up-to-Date</p>
            
            <div id="canadiens-card">
                <h3>Montreal Canadiens</h3>
                <div id="canadiens-score">Loading...</div>
                <div id="canadiens-status"></div>
            </div>

            <div id="live-scores">
                <h3>Out of Town Scoreboard</h3>
                <div id="scores-container">Loading scores...</div>
            </div>
        </section>

        

    </main>

  <script>
        function formatGameStatus(type, detail) {
            if (type === "STATUS_FINAL") return "Final";
            if (type === "STATUS_SCHEDULED") return detail;
            if (type === "STATUS_IN_PROGRESS") return detail;
            return detail;
        }

        async function fetchNHLScores() {
            try {
                const response = await fetch('https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard');
                const data = await response.json();

                const events = data.events || [];
                displayCanadiens(events);

                const scoresContainer = document.getElementById('scores-container');

                if (!events.length) {
                    scoresContainer.innerHTML = '<p>No games scheduled</p>';
                    return;
                }

                let html = `<table>
                    <tr>
                        <th>Away</th>
                        <th>Score</th>
                        <th>Home</th>
                        <th>Status</th>
                    </tr>`;

                events.forEach(event => {
                    const away = event.competitions[0].competitors[1];
                    const home = event.competitions[0].competitors[0];

                    html += `
                        <tr>
                            <td>${away.team.displayName}</td>
                            <td>${away.score} - ${home.score}</td>
                            <td>${home.team.displayName}</td>
                            <td>${formatGameStatus(event.status.type.name, event.status.type.detail)}</td>
                        </tr>
                    `;
                });

                html += `</table>`;
                scoresContainer.innerHTML = html;

            } catch (err) {
                console.error(err);
            }
        }

        let previousCanadiensScore = null;

        function displayCanadiens(events) {
            const game = events.find(e =>
                e.competitions[0].competitors.some(c =>
                    c.team.displayName === 'Montreal Canadiens'
                )
            );

            const scoreDiv = document.getElementById('canadiens-score');
            const statusDiv = document.getElementById('canadiens-status');

            if (!game) {
                scoreDiv.textContent = "No game today";
                return;
            }

            const home = game.competitions[0].competitors[0];
            const away = game.competitions[0].competitors[1];

            scoreDiv.innerHTML = `
                <div style="display:flex;justify-content:center;gap:15px;align-items:center;">
                    <img src="${away.team.logo}" class="score-logo">
                    <span>${away.score} - ${home.score}</span>
                    <img src="${home.team.logo}" class="score-logo">
                </div>
            `;

            statusDiv.textContent = formatGameStatus(
                game.status.type.name,
                game.status.type.detail
            );
        }

        

        fetchNHLScores();

        setInterval(fetchNHLScores, 3000);
    </script>
    <footer>
        <p>&copy; 2026 HabsTracker1909. All rights reserved.</p>
        <p>Follow us on : <a href="#">Instagram</a></p>
    </footer>

</body>
</html>
